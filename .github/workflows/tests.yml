# Прогон тестов. Отдельным файлом, потому что его вызывает релиз: тесты нужны
# и сами по себе, и как условие выпуска, а два одинаковых описания разошлись бы.
name: tests

on:
  pull_request:
  # Вызов из release.yml — на main тесты идут в составе релиза, не вторым прогоном.
  workflow_call:
  workflow_dispatch:

jobs:
  pytest:
    # README обещает Windows, Linux и macOS. Windows проверяем потому, что
    # программа windows-овая, Linux — потому что обещание надо чем-то держать.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Нужно шагу «Бейдж покрытия»: он коммитит JSON обратно в ветку.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Версию задаём явно: pyproject разрешает всё от 3.11, и без этого
          # тесты шли бы на том Python, который окажется на раннере сегодня.
          python-version: "3.12"

      # `--locked` роняет прогон, если uv.lock отстал от pyproject: пересобранное
      # на лету окружение проверяло бы не то, что стоит у пользователя.
      - name: Окружение
        run: uv sync --locked

      - name: Тесты
        run: uv run pytest -q --cov=sgbuddy --cov-report=term-missing

      # Число одно и то же на обеих ОС — считаем и коммитим только с Linux,
      # иначе два матричных job'а столкнутся, пушя один и тот же файл.
      # На pull_request не пушим: у GITHUB_TOKEN там нет прав на запись,
      # да и коммитить в чужую ветку из проверки PR не дело.
      - name: Бейдж покрытия
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: |
          percent=$(uv run coverage report --format=total)

          color=red
          if   [ "$percent" -ge 90 ]; then color=brightgreen
          elif [ "$percent" -ge 75 ]; then color=green
          elif [ "$percent" -ge 60 ]; then color=yellowgreen
          elif [ "$percent" -ge 40 ]; then color=yellow
          elif [ "$percent" -ge 20 ]; then color=orange
          fi

          mkdir -p .github/badges
          cat > .github/badges/coverage.json <<JSON
          {"schemaVersion": 1, "label": "coverage", "message": "${percent}%", "color": "${color}"}
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновлён бейдж покрытия (${percent}%)"
            git push
          fi
